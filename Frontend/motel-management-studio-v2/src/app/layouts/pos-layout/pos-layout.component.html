<div class="pos-layout" #layoutRoot>
  <aside class="pos-sidebar">
    <a class="brand" routerLink="/pos" aria-label="El Rapidin POS">
      <svg aria-hidden="true" viewBox="0 0 58 48"><path d="M10 28h38c0 9-8 15-19 15S10 37 10 28Z" fill="currentColor"/><path d="M17 23c-5-5 4-8 0-14M29 23c-5-5 4-8 0-14M41 23c-5-5 4-8 0-14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <span><strong>EL RAPIDIN</strong><small>RECEPCION</small></span>
    </a>

    <button class="pos-nav-toggle" type="button" aria-controls="pos-navigation"
      [attr.aria-expanded]="narrowNavigationOpen()" (click)="narrowNavigationOpen.set(!narrowNavigationOpen())">
      <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
      <span>Menú POS</span>
      <span class="pos-nav-toggle__chevron" [class.is-open]="narrowNavigationOpen()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>
    </button>

    <nav id="pos-navigation" class="pos-nav" [class.is-expanded]="narrowNavigationOpen()"
      aria-label="Navegación del punto de venta" (click)="closeNavigationOnLink($event)" (keydown.escape)="dismissNavigation()">
      <div class="pos-nav__group">
        <small class="pos-nav__heading">VENTA</small>
        <a [routerLink]="['/pos', 'rooms']" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Recepción, servicio al cuarto"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span><span>Recepción</span></a>
        <a [routerLink]="['/pos', 'minibar']" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Minibar, carrito de productos"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="m4 7 8-4 8 4v10l-8 4-8-4V7Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg></span><span>Minibar</span></a>
      </div>

      <div class="pos-nav__group">
        <small class="pos-nav__heading">CONTROL</small>
        <a routerLink="/admin/cashbox" routerLinkActive="is-active" aria-label="Caja, sesiones y arqueos"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></span><span>Caja</span></a>
        <a routerLink="/admin" routerLinkActive="is-active" aria-label="Back Office"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span>Back Office</span></a>
      </div>
    </nav>

  </aside>

  <section class="pos-stage">
    <header class="pos-header">
      <div class="branch-block">
        <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
        <span class="branch-block__copy"><small>Sucursal</small><strong>El Rapidin</strong></span>
      </div>

      <div class="header-tools">
        <span class="connection-status" role="status">
          <i aria-hidden="true"></i>Con red
        </span>

        <span class="header-currency">
          <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></span>
          <span>{{ currencyCode() }}</span>
        </span>

        <div class="operator-block" [attr.aria-label]="'Operador: ' + operatorName()">
          <span class="avatar" aria-hidden="true">{{ operatorInitials() }}</span>
          <span class="operator-block__name">{{ operatorName() }}</span>
        </div>

        <time class="clock" [attr.datetime]="now().toISOString()" title="Hora local del dispositivo">
          <strong>{{ now() | date: 'h:mm a' }}</strong>
          <small>{{ now() | date: 'd MMM y' }}</small>
        </time>
      </div>
    </header>

    <main class="pos-content"><router-outlet (activate)="resetScrollPosition()" /></main>
  </section>
</div>
